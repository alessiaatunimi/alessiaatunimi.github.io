{{ define "main" }}<article class="wrap article"><header class="page-heading"><p class="eyebrow">{{ .Params.status }}{{ with .Params.year }} · {{ . }}{{ end }}</p><h1 class="paper-title">{{ .Title }}</h1><p class="lead">{{ .Params.authors }}</p><p>{{ .Params.venue }}</p>{{ with .Params.link }}<a class="button" href="{{ . }}">Read the publication ↗</a>{{ end }}</header><div class="prose">{{ .Content }}<a href="{{ "/publications/" | relURL }}">← All publications</a></div></article>{{ end }}
